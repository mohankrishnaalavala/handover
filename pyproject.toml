[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "handover"
version = "1.0.0"
description = "Universal AI chat to local agent handover tool"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohan Krishnaa Alavala" }]
requires-python = ">=3.11"
keywords = ["claude", "claude-code", "cli", "handover", "agent", "ai"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "click>=8.0",
  "anthropic>=0.40.0",
  "jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
]
watch = [
  "watchdog>=4.0",
]
mcp = [
  "mcp>=1.0",
]

[project.scripts]
handover = "handover.cli:main"

[project.urls]
Homepage = "https://github.com/mohankrishnaalavala/handover"
Issues = "https://github.com/mohankrishnaalavala/handover/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
