<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>handover</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <span class="logo">handover</span>
    <span class="tagline">Design in chat. Build in terminal.</span>
  </div>

  <!-- ── Primary action: export JSON ─────────────────────────────────── -->
  <button id="btn-export" class="primary">
    Export Chat as JSON
  </button>

  <div id="status-export" class="status hidden"></div>

  <div class="divider">
    <span>or send to local server</span>
  </div>

  <!-- ── Secondary action: live pipeline ─────────────────────────────── -->
  <div class="section">
    <label for="output-dir">Output directory</label>
    <input
      id="output-dir"
      type="text"
      placeholder="~/projects/myapp/"
      spellcheck="false"
    />
  </div>

  <div class="section">
    <label for="port">Server port</label>
    <input id="port" type="number" value="7437" min="1024" max="65535" />
  </div>

  <button id="btn-handover" class="secondary">
    Send to Claude Code
  </button>

  <div id="status-handover" class="status hidden"></div>

  <div class="footer">
    <span>Send requires <code>handover serve</code> running locally</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
